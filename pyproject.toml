[project]
name = "nexuslims-cdcs"
version = "3.23.0+nx0"
description = "NexusLIMS-CDCS: An automated laboratory information management system for microscopy data management"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Datasophos LLC"},
]
keywords = ["NexusLIMS", "MDCS", "CDCS", "microscopy", "data management", "materials science"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "celery",
    "Django",
    # Redis-backed caching for production
    # Base MDCS uses Django's default LocMemCache, but we use Redis for:
    # - Better performance with persistent cache across container restarts
    # - Shared cache across multiple app instances (if scaled horizontally)
    # - Session storage that survives application restarts
    # Required by: config/settings/prod_settings.py
    "django-redis",
    # CDCS/MDCS core packages - all pinned to 2.23.* for compatibility
    "core_main_app[auth]==2.23.*",
    "core_composer_app==2.23.*",
    "core_curate_app==2.23.*",
    "core_dashboard_common_app==2.23.*",
    "core_dashboard_app==2.23.*",
    "core_explore_example_app==2.23.*",
    "core_explore_keyword_app==2.23.*",
    "core_explore_federated_search_app==2.23.*",
    "core_exporters_app==2.23.*",
    "core_federated_search_app==2.23.*",
    "core_website_app==2.23.*",
    "core_module_blob_host_app==2.23.*",
    "core_module_remote_blob_host_app==2.23.*",
    "core_module_advanced_blob_host_app==2.23.*",
    "core_module_excel_uploader_app==2.23.*",
    "core_module_periodic_table_app==2.23.*",
    "core_module_chemical_composition_app==2.23.*",
    "core_module_chemical_composition_simple_app==2.23.*",
    "core_module_text_area_app==2.23.*",
    "core_file_preview_app==2.23.*",
    "core_linked_records_app==2.23.*",
    # Production server packages
    "psycopg2-binary",       # PostgreSQL adapter
    "uwsgi",                 # Application server
    "gunicorn[gthread]",     # Alternative application server with threading support
    "python-dotenv",         # .env loading for dev_settings.py and test_settings.py
]

[dependency-groups]
dev = [
    "pytest-playwright",
    "pytest-xdist",
]
docs = [
    "sphinx>=8,<10",
    "myst-parser>=4,<6",
    "pydata-sphinx-theme>=0.16,<0.17",
    "sphinx-design>=0.6,<0.8",
    "sphinxcontrib-mermaid>=1.2,<2",
    "sphinx-copybutton>=0.5,<0.6",
    "linkify-it-py>=2,<3",
]

[tool.pytest.ini_options]
pythonpath = ["tests/e2e"]
filterwarnings = [
    "ignore::urllib3.exceptions.InsecureRequestWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexuslims_annotate", "nexuslims_gallery", "nexuslims_overrides", "mdcs", "mdcs_home", "tests"]

[tool.black]
line-length = 79
target-version = ['py313']
include = '\.pyi?$'
