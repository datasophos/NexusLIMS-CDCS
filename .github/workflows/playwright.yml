name: Playwright E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Run E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment

    env:
      COMPOSE_FILE: docker-compose.base.yml:docker-compose.ci.yml
      COMPOSE_ENV_FILES: .env.dev
      CADDYFILE: Caddyfile.dev
      COMPOSE_PROJECT_NAME: nexuslims_ci

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install
        working-directory: ${{ github.workspace }}

      - name: Install Python dependencies
        run: uv sync --dev
        working-directory: ${{ github.workspace }}

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
        working-directory: ${{ github.workspace }}

      - name: Extract test data archive
        run: bash scripts/setup-test-data.sh

      - name: Build Docker image
        run: COMPOSE_BAKE=true docker compose build cdcs

      - name: Start services
        run: |
          docker compose up -d
          # Wait for the CDCS app to respond
          for _ in $(seq 1 30); do
            curl --silent --insecure \
              --output /dev/null --write-out "%{http_code}" \
              https://nexuslims-dev.localhost/ | grep -qE "^[23]" && break
            echo "Waiting for CDCS..."
            sleep 10
          done

      - name: Run init_environment.py (loads schema, XSLT, test records, admin/admin user)
        run: |
          docker exec nexuslims_ci_cdcs \
            python /srv/scripts/init_environment.py

      - name: Run Playwright tests
        run: |
          uv run pytest tests/e2e/ \
            --screenshot=only-on-failure \
            --output=deployment/test-results/ \
            -v
        working-directory: ${{ github.workspace }}

      - name: Capture container logs on failure
        if: failure()
        run: |
          mkdir -p container-logs
          for svc in cdcs caddy simplesamlphp postgres redis; do
            docker compose logs --no-color "$svc" \
              > "container-logs/${svc}.log" 2>&1 || true
          done

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: deployment/container-logs/
          retention-days: 7

      - name: Capture container logs on failure
        if: failure()
        run: |
          mkdir -p container-logs
          for svc in cdcs caddy simplesamlphp postgres redis; do
            docker compose logs --no-color "$svc" \
              > "container-logs/${svc}.log" 2>&1 || true
          done

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: deployment/container-logs/
          retention-days: 7

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: deployment/test-results/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v
