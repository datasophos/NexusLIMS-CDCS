name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: sphinx-build -b html -n -W --keep-going docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html

  publish:
    needs: build
    if: >-
      github.event_name == 'push' || github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: site
      - name: Select destination
        id: destination
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$EVENT" in
            release)
              if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nx[0-9]+$ ]]; then
                echo "Unsupported CDCS release tag: $TAG" >&2
                exit 1
              fi
              echo "path=$TAG" >> "$GITHUB_OUTPUT" ;;
            *) echo "path=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: ${{ steps.destination.outputs.path }}
          keep_files: true
      - name: Publish stable documentation
        if: github.event_name == 'release' && !github.event.release.prerelease
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: stable
          keep_files: true
